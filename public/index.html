<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLX India</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Инициализация Telegram (работает везде)
      window.Telegram?.WebApp?.ready();
      window.Telegram?.WebApp?.expand();
      // MainButton для "Разместить объявление"
      window.Telegram?.WebApp?.MainButton?.setText('🚀 Разместить объявление')?.show();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
